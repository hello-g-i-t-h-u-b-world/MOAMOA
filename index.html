<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모아모아 도우미</title>
  </head>
  <body>
    <header class="topbar">
      <h1>모아모아 도우미</h1>
      <div class="controls">
        <button id="btnCapture" class="primary">화면 공유 시작</button>
        <label class="btn" title="스크린샷 파일로 테스트">
          이미지 열기<input id="fileInput" type="file" accept="image/*" hidden />
        </label>
        <button id="btnCalib">영역 지정</button>
        <button id="btnLock" class="active" title="블록 3개를 받아 계산한 추천을 다음 블록을 받을 때까지 고정">추천 고정: 켜짐</button>
        <button id="btnResolve" title="지금 화면 기준으로 다시 계산">다시 계산</button>
        <button id="btnPause">일시정지</button>
        <button id="btnReset" title="보드/손패/아이템 초기화">초기화</button>
        <button id="btnSave" title="최근 약 8초의 화면과 인식 결과를 파일로 저장 (잘못 인식될 때 분석용)">화면 저장</button>
        <select id="effort" title="탐색 강도">
          <option value="fast">빠름</option>
          <option value="normal" selected>보통</option>
          <option value="deep">정밀</option>
        </select>
      </div>
      <span id="status" class="status">대기 중</span>
    </header>

    <section id="calibPanel" class="calib" hidden>
      <div class="calib-head">
        <div class="targets" id="calibTargets"></div>
        <span id="calibMsg" class="calib-msg"></span>
        <div class="rect-inputs" id="rectInputs"></div>
        <button id="btnSnap" title="보드 영역을 실제 격자선에 자동으로 맞춤">격자 자동 맞춤</button>
        <button id="btnCalibDone" class="primary">완료</button>
      </div>
      <div class="preview-wrap"><canvas id="preview"></canvas></div>
    </section>

    <main class="layout">
      <div id="swapBanner" class="swap-banner" hidden></div>
      <section class="board-panel">
        <div class="step-tabs" id="stepTabs"></div>
        <div id="board" class="board"></div>
        <p class="hint">클릭: 칸 채우기/비우기 · 우클릭: 아이템 표시(⇄ → ⊙ → 없음)</p>
      </section>

      <section class="side">
        <div class="card">
          <h2>추천 순서</h2>
          <ol id="moves" class="moves"></ol>
          <div id="verdict" class="verdict"></div>
        </div>
        <div class="card">
          <h2>보유 조각</h2>
          <div id="hand" class="hand"></div>
        </div>
        <div class="card">
          <h2>보유 능력</h2>
          <div id="inventory" class="inventory"></div>
          <div id="swapAdvice" class="advice"></div>
        </div>
        <div class="card">
          <h2>기록</h2>
          <ul id="log" class="log"></ul>
        </div>
      </section>
    </main>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
